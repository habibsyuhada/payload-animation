name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright Chromium
        # packages/ui's tests render real DOM via @vitest/browser (ADR 0003) — every `pnpm test`
        # run needs Chromium, not just the separate S1.6 determinism-cross-platform job below.
        run: pnpm --filter @payload/ui exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  balance-dominance:
    # V7.4 / ADR 0006 §10: ruleset v2 multiplies the combination space far past what five
    # hand-written archetypes cover, so a seeded generator plays random sheets against every
    # defense archetype and this job fails on any build that beats *everything*. Findings already
    # recorded in tools/balance-lab/src/known-dominance.ts do not fail it — that file is the
    # outstanding balance debt, and shrinking it is the release gate for shipping v2 to players.
    # Its own job because the search is ~7000 battles (about a minute), not because it is optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Search for dominant builds
        run: pnpm --filter @payload/balance-lab dominance

  determinism-cross-platform:
    # S1.6: proves packages/sim's simulate() produces a byte-identical BattleLog (hashed —
    # test/determinism.test.ts) on a real browser engine, not just Node. Separate job from
    # lint-test-build so installing Playwright's Chromium doesn't slow down the fast path.
    # Also runs packages/replay's export.ts tests (R2.5) — real MediaRecorder/WebM encoding,
    # same "needs an actual browser, not just Node" reason, same `pnpm test:browser` task.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @payload/sim exec playwright install --with-deps chromium

      - name: Run cross-platform / browser-only tests in Chromium
        run: pnpm test:browser
